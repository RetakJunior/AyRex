[package]
name = "ayrex"
version = "0.1.2"
edition = "2024"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9.8"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = "0.1.34"

[target.'cfg(windows)'.dependencies]
wasapi = "0.26.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
