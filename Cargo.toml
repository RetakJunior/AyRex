[package]
name = "ayrex"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
xcap = "0.9.8"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = "0.1.34"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
